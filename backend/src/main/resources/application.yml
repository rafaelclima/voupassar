# VouPassar — configuração base (TASK 3.1).
# Profile ativo via SPRING_PROFILES_ACTIVE (dev padrão local).
# Segredos e hosts via ambiente — nunca hardcoded (AGENTS.md §29).
app:
  service-name: voupassar-backend
  version: "@project.version@"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}"
  # Auth (TASK 3.5). Segredo via env em produção — o default abaixo é SÓ
  # para dev local (boot falha se o segredo tiver < 32 bytes).
  security:
    jwt-secret: "${JWT_SECRET:dev-only-secret-CHANGE-ME-min-32-chars-0123456789ab}"
    jwt-issuer: "${JWT_ISSUER:voupassar}"
    access-ttl-minutes: "${ACCESS_TTL_MINUTES:15}"
    refresh-ttl-days: "${REFRESH_TTL_DAYS:7}"
    reset-ttl-minutes: "${RESET_TTL_MINUTES:60}"
    bcrypt-strength: "${BCRYPT_STRENGTH:10}"
    rate-limit:
      enabled: "${RATE_LIMIT_ENABLED:true}"
      max-requests: "${RATE_LIMIT_MAX:60}"
      window-seconds: "${RATE_LIMIT_WINDOW_SECONDS:60}"
      write-max-requests: "${RATE_LIMIT_WRITE_MAX:120}"
    # TASK 22.1: true atrás de proxy reverso que injeta X-Forwarded-For real
    # (VPS prod). Quando false, o header é ignorado (anti-spoofing).
    behind-proxy: "${BEHIND_PROXY:false}"

server:
  port: "${SERVER_PORT:8080}"
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: voupassar-backend
  profiles:
    default: dev
  # Jackson 3 (Boot 4, tools.jackson): sem overrides por propriedade no
  # bootstrap — defaults + @JsonFormat onde necessário. A propriedade
  # spring.jackson.serialization.* do Jackson 2 não dá bind no Boot 4.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema pertence às migrations (TASK 2.2); nunca create
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history # mesma tabela do migrate via Compose
    baseline-on-migrate: true
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true

# OpenAPI (TASK 3.2): contrato em /v3/api-docs, UI em /swagger-ui.html.
# Escopo restrito à API versionada; Actuator fora da documentação.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  paths-to-match: /api/v1/**
  packages-to-scan: br.com.voupassar

logging:
  level:
    root: INFO
    br.com.voupassar: INFO
