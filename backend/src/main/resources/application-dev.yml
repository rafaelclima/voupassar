# Profile dev — Compose local (app + db). Paridade com a VPS.
spring:
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:voupassar}}"
    username: "${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:voupassar}}"
    password: "${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:CHANGE_ME}}"
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    show-sql: false

logging:
  level:
    br.com.voupassar: DEBUG
