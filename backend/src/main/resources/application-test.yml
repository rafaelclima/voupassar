# Profile test — slices MockMvc sem Postgres (H2 em memória).
# Integração real com Postgres fica para Testcontainers nas TASKs 3.2+.
spring:
  datasource:
    url: jdbc:h2:mem:voupassar-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  security:
    user:
      name: test
      password: test

logging:
  level:
    root: WARN
    br.com.voupassar: DEBUG
