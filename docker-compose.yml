# VouPassar — stack local (referência) e base da réplica na VPS.
# Sobe tudo localmente primeiro; a VPS recebe réplica do validado aqui
# (mesma imagem, mesmo Compose, só com variáveis/hosts de produção).
# Uso: cp .env.example .env && docker compose up -d && ./scripts/db/migrate.sh
services:
  db:
    image: postgres:16-alpine
    container_name: voupassar-db
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voupassar}
      POSTGRES_USER: ${POSTGRES_USER:-voupassar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API Spring Boot (TASK 3.1). Mesma imagem na VPS (perfil prod).
  # Uso local: docker compose up -d --build && curl http://localhost:8080/api/v1/health
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: voupassar-backend:0.1.0-SNAPSHOT
    container_name: voupassar-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB:-voupassar}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-voupassar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    ports:
      - "${APP_PORT:-8080}:8080"
    # VPS 2 GB: teto explícito (app + db + proxy cabem; calibrar em carga).
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Versionamento standalone (mesmo mecanismo do Spring: tabela
  # flyway_schema_history sobre database/migrations).
  # Uso: docker compose --profile tools run --rm migrate
  migrate:
    image: flyway/flyway:11-alpine
    container_name: voupassar-migrate
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env]
    environment:
      FLYWAY_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB:-voupassar}"
      FLYWAY_USER: ${POSTGRES_USER:-voupassar}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      FLYWAY_LOCATIONS: "filesystem:/flyway/sql"
      FLYWAY_TABLE: flyway_schema_history
    volumes:
      - ./database/migrations:/flyway/sql:ro
    profiles: [tools]

volumes:
  pgdata:
