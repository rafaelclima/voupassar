<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script>
    // Aplica o tema antes da primeira pintura: sem isso a página carrega
    // clara e "pula" para a escura quando o main.js roda. Os tokens do
    // tema escuro estão em css/tokens.css ([data-theme="dark"]).
    // Padrão do produto: tema claro. O escuro só entra com escolha manual.
    try {
      var t = localStorage.getItem("theme");
      if (t !== "dark" && t !== "light") {
        t = "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <meta name="description" content="Entrar no VouPassar — acesse sua conta de estudos para o IFRN com e-mail e senha." />
  <meta name="voupassar-api" content="http://localhost:8080" />
  <meta name="theme-color" content="#0d2b45" />
  <link rel="preload" href="./assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/utilities.css" />
  <link rel="stylesheet" href="./css/auth.css" />
  <title>Entrar — VouPassar</title>
</head>
<body class="login-page">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <main id="conteudo" class="login-stage">
    <div class="login-shell">
      <!-- Painel de marca: só a logo. -->
      <section class="login-brand" aria-label="VouPassar">
        <img class="login-brand__logo" src="./assets/logo-full.png" alt="VouPassar" width="360" height="360" />
      </section>

      <!-- Painel de acesso: mesmos hooks do login.js (ids preservados). -->
      <section class="login-panel" aria-labelledby="auth-t">
        <div class="login-panel__top">
          <a class="brand brand--sm" href="./index.html" aria-label="VouPassar — início">
            <img class="brand__mark" src="./assets/logo-mark.png" alt="" width="30" height="30" /><img class="brand__mark brand__mark--inverse" src="./assets/logo-mark-light.png" alt="" width="30" height="30" />
            <span>VouPassar</span>
          </a>
          <a class="login-signup" href="./cadastro.html">Criar conta</a>
        </div>

        <h1 id="auth-t" class="login-panel__title">Entrar</h1>
        <p class="muted login-panel__lede">Acesse com o e-mail e a senha do seu cadastro.</p>

        <div id="auth-feedback"></div>
        <div id="auth-already" hidden></div>

        <form id="login-form" novalidate aria-describedby="login-hint">
          <p class="muted login-hint" id="login-hint"><small>Se o e-mail ou a senha estiver errado, aparece a mesma mensagem nos dois casos.</small></p>
          <div class="field mt-4">
            <label class="field__label" for="login-email">E-mail <span class="required" aria-hidden="true">*</span></label>
            <input class="input input--pill" id="login-email" name="email" type="email" autocomplete="email" spellcheck="false" required maxlength="254" placeholder="voce@exemplo.com" />
          </div>
          <div class="field">
            <label class="field__label" for="login-password">Senha <span class="required" aria-hidden="true">*</span></label>
            <div class="password-field">
              <input class="input input--pill" id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="Sua senha" />
              <button type="button" class="password-toggle password-toggle--pill" data-password-toggle="login-password" aria-label="Mostrar senha">Mostrar</button>
            </div>
          </div>
          <div class="login-options">
            <label class="check-row"><input type="checkbox" name="remember" value="1" /> Manter conectado</label>
            <a class="login-forgot" href="./recuperar-senha.html">Esqueci minha senha</a>
          </div>
          <div class="btn-group mt-4">
            <button type="submit" class="btn btn--primary btn--block btn--pill" id="login-submit">
              <svg class="btn__icon" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
                <path d="M3 10h12M11 5.5 15.5 10 11 14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              Entrar
            </button>
          </div>
        </form>

        <p class="login-back"><a href="./index.html">← Voltar ao início</a></p>
      </section>
    </div>
    <noscript>
      <div class="alert alert--warning mt-4" role="note">
        <div>
          <strong>JavaScript desligado</strong>
          <p>A tela de entrar precisa de JavaScript para validar os campos e falar com a API. Ative para continuar.</p>
        </div>
      </div>
    </noscript>
  </main>

  <script type="module" src="./js/main.js"></script>
  <script type="module" src="./js/views/login.js"></script>
</body>
</html>
