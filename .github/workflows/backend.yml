name: Backend — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: "backend"
  cancel-in-progress: false

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Verificar arquivos obrigatórios
        run: |
          [ -f backend/pom.xml ] || exit 1
          [ -f backend/Dockerfile ] || exit 1
          [ -f docker-compose.yml ] || exit 1
          [ -f database/migrations/V1__schema.sql ] || exit 1
          echo "Arquivos obrigatórios presentes"

      - name: Build backend
        run: mvn -f backend/pom.xml -q -DskipTests package

      - name: Testes unitários e integração
        run: mvn -f backend/pom.xml -B test

      - name: Verificar artefato gerado
        run: |
          [ -f backend/target/voupassar-backend-*.jar ] || exit 1
          echo "Artefato JAR gerado com sucesso"

  build-image:
    # Só manual (workflow_dispatch): cada push na main já valida build+testes;
    # gerar imagem e encostar na VPS a cada commit (docs, JSON, frontend)
    # reiniciaria a API em produção sem necessidade.
    if: github.event_name == 'workflow_dispatch'
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Sem login em registry: o build usa push:false e a imagem viaja
      # para a VPS via artifact (docker save/load). O login quebrava o
      # job quando DOCKER_USERNAME/DOCKER_PASSWORD não estão definidos.
      - name: Build imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          # Sem load:true a imagem fica só no cache do Buildx e o
          # `docker save` do passo seguinte não a encontra.
          load: true
          tags: voupassar-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Salvar imagem localmente
        run: |
          docker save voupassar-backend:${{ github.sha }} -o /tmp/voupassar-backend.tar
          echo "Imagem salva em /tmp/voupassar-backend.tar"

      - name: Upload imagem
        uses: actions/upload-artifact@v4
        with:
          name: voupassar-backend-image
          path: /tmp/voupassar-backend.tar
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate-and-test, build-image]
    runs-on: ubuntu-latest
    environment:
      name: vps
      url: ${{ vars.VPS_HOST || 'https://voupassar.vps.local' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Falha cedo com mensagem clara quando os secrets não estão
      # cadastrados (sem isso o ssh recebe destino vazio e devolve
      # apenas "usage: ssh ...", sem dizer o que faltou).
      - name: Checar secrets da VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY || vars.VPS_SSH_KEY }}
        run: |
          [ -n "$VPS_HOST" ] || { echo "Faltando VPS_HOST (vars ou secrets do repo)"; exit 1; }
          [ -n "$VPS_USER" ] || { echo "Faltando VPS_USER (vars ou secrets do repo)"; exit 1; }
          [ -n "$VPS_SSH_KEY" ] || { echo "Faltando VPS_SSH_KEY (secrets do repo)"; exit 1; }
          echo "Secrets da VPS presentes"

      - name: Configurar SSH para deploy
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY || vars.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host $VPS_HOST
            StrictHostKeyChecking no
            User $VPS_USER
            IdentityFile ~/.ssh/id_rsa" >> ~/.ssh/config
          echo "SSH configurado para $VPS_HOST como $VPS_USER"

      - name: Download imagem
        uses: actions/download-artifact@v4
        with:
          name: voupassar-backend-image
          path: /tmp/

      - name: Carregar imagem na VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
        run: |
          cat /tmp/voupassar-backend.tar | ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "cat > /tmp/voupassar-backend.tar && docker load < /tmp/voupassar-backend.tar && rm /tmp/voupassar-backend.tar"
          echo "Imagem carregada na VPS"

      - name: Deploy na VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "
            docker tag voupassar-backend:${{ github.sha }} voupassar-backend:latest &&
            docker compose pull app || true &&
            docker compose up -d --build app || docker run -d --name voupassar-app --restart unless-stopped -p 8080:8080 -e SPRING_PROFILES_ACTIVE=prod -e JAVA_OPTS='-Xms256m -Xmx512m' voupassar-backend:latest
          "
          echo "Deploy concluído na VPS"
